name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (CPU, no GPU-marked tests)
        run: python -m pytest -q -m "not gpu"
      - name: Test-set lock (well-formed; no training config references a test set)
        run: python scripts/check_test_lock.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
