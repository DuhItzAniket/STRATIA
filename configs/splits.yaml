# Split design (P037), implemented by scripts/make_splits.py (P038). See docs/splits.md for the reasoning.
# version 2 (P054, 2026-10-11): LODO folds carry a 'val' role = the held-out source's in-domain val units, so the
# pre-registered gate (judged on validation data) has an unlocked LODO number; LODO 'test' = the rest of the source.
# The in-domain and held-out-station files are unchanged by this version.
version: 2
seed: 0

# Share of units (not images) per split inside each source; units are assigned greedily to balance the
# stratification column, so the image shares come out close to these.
fractions: {train: 0.70, val: 0.10, test: 0.20}

# Sources: the SWIM family is one source (P025: SWINySEG holds copies of SWIMSEG and SWINSEG; SWIMCAT and SHWIMSEG
# come from the same cameras). Every other dataset is its own source.
sources:
  swimseg: swim
  swinseg: swim
  swinyseg: swim
  swimcat: swim
  shwimseg: swim

# The unit a split may not cut: a connected component of "same group" and "same block" (temporal blocks, P027).
# Exact duplicates (P024) always share a unit. Near-duplicate links (dihedral-pHash copies and same-scene pairs,
# P025) do so only where no temporal block exists: inside a time series the block is the unit, a pHash match between
# smooth-sky frames days apart or at the other station is a coincidence (P026), and a same-scene link across days or
# stations is a weather look-alike; applied, they fuse whole days or weeks into one unit.
near_duplicate_links_only_without_blocks: true
blocks:
  eye2sky:    {kind: day, shared_across_cameras: true}   # AURIC and BARSE on the same date go to the same split (P027)
  montenegro: {kind: days, length_days: 7}               # contiguous weeks (P027: correlated across days)
  almeria:    {kind: day}
  b0268:      {kind: day}
  default:    {kind: group}

# Column that the greedy assignment balances across splits inside a source (native labels; P030).
stratify:
  ccsn: source_label
  mgcd: source_label
  swimcat: source_label
  montenegro: primary_class        # first altitude class of the rater majority
  almeria: cloud_fraction_bin      # from P030's mask cloud fraction
  swim: dataset                    # keep each SWIM member's share equal across splits

# Samples that never go to a test split (they stay in train): P026 conflict merges.
exclude_from_test:
  flags: [label_conflict]

# Leave-one-dataset-out: each fold holds out one whole source; training uses the train + val units of the others.
lodo:
  folds: [ccsn, mgcd, montenegro, swim, almeria]

# Held-out station (Eye2Sky): train on one station, test on the other; `disjoint_days` also removes the test
# station's days from training (P027: same-moment frames 15 km apart are correlated through the weather).
held_out_station:
  dataset: eye2sky
  train_camera: eye2sky-AURIC
  test_camera: eye2sky-BARSE
  variants: [same_days, disjoint_days]

# Few-shot target protocol (B0268, from P041 on): adaptation on k whole days, test on the remaining days.
few_shot_target:
  dataset: b0268
  unit: day
  shots_days: [0, 1, 3]
  repeats: 5

# Published splits that are reported next to ours for comparison only (they leak: P026).
published_for_comparison: [mgcd, almeria]

# Cloud-base-height pairs at the ceilometer sites (P047, scripts/make_cbh_pairs.py -> data/splits/cbh_pairs.parquet).
# Units are calendar days shared across the two stations; days already assigned by the in-domain Eye2Sky split keep
# that assignment (same date -> same split, P027); the remaining days are assigned to `fractions` with the day's
# dominant ceilometer label as the stratum. Night frames are never in the splits (daytime model).
cbh_pairs:
  stations: {OLDLR: CDLRA, WESTE: CDLRB}
  cadence_s: 120            # one frame every two minutes (P027: adjacent frames are 82-92 % the same scene)
  max_gap_s: 15             # nearest 30 s grid point of the P036 targets (P031 tolerance is the +-30 s window)
  roi_deg: 10               # zenith region of interest recorded per pair (radius in pixels)
  inherit_from: in_domain   # Eye2Sky day assignment of the in-domain split, where it exists
