[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratia"
dynamic = ["version"]
description = "STRATIA: single-camera sky understanding (cloud genus, layers, cover, cloud-base height)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.dynamic]
version = { attr = "stratia.__version__" }

[tool.setuptools.packages.find]
include = ["stratia*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (skipped in CI)"]
